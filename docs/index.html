<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b58">
<title>Painel Comercial SEIBT · Pedidos e Faturamento</title>
<style>
:root {
  color-scheme: light;
  --navy: #090b58; --ink: #151b35; --muted: #697185;
  --red: #d64545; --blue: #1f5fbf; --green: #2e9e4f;
  --line: #e2e6ed; --track: #e4e7ee; --surface: #f1f3f8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
button, select { font: inherit; }
button, select { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid #3278df; outline-offset: 3px; }
.dashboard { height: 100vh; height: 100dvh; min-height: 660px; display: flex; flex-direction: column; }
.topbar { background: var(--navy); color: white; display: flex; align-items: center; justify-content: space-between; padding: clamp(16px,2vh,28px) 2.4vw; gap: 28px; flex: none; border-bottom: 4px solid #d64545; }
.eyebrow { font-size: clamp(10px,.73vw,15px); font-weight: 600; letter-spacing: .23em; margin: 0 0 7px; color: #b5badc; }
h1 { margin: 0; font-size: clamp(25px,2.35vw,48px); letter-spacing: -.035em; line-height: 1.12; font-weight: 650; }
.title-dot { color: #ff666b; }
.brand { padding-left: 32px; border-left: 1px solid #ffffff30; display: flex; align-items: center; }
.brand img { display: block; width: clamp(100px,9vw,190px); height: auto; max-height: 76px; object-fit: contain; }
.context { display: flex; align-items: center; gap: 3.4vw; padding: 1.45vh 2.4vw; flex: none; }
.context-label { display: block; font-size: clamp(9px,.61vw,13px); font-weight: 650; letter-spacing: .12em; color: var(--muted); margin-bottom: 4px; }
.context strong { font-size: clamp(14px,1vw,21px); font-weight: 650; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-weight: 400; }
.snapshot { border-left: 1px solid #d4d9e3; padding-left: 3.4vw; }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; border: 1px solid #d6dbe6; border-radius: 24px; padding: 8px 13px; color: #505b74; font-size: clamp(11px,.74vw,15px); white-space: nowrap; }
.status-dot { width: 7px; height: 7px; background: #b77c1c; border-radius: 50%; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); grid-template-rows: repeat(2,minmax(0,1fr)); gap: 1.6vh 1.3vw; padding: 0 2.4vw; }
.card { background: #fff; border: 1px solid #dfe3ec; border-radius: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 3px 8px #17204705; }
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 1.3vh 1.5vw 0; }
.card-title { display: flex; align-items: center; gap: 10px; }
.card-icon { width: 30px; height: 30px; background: #f1f3fa; color: var(--navy); border-radius: 8px; display: grid; place-items: center; }
.card-icon svg { width: 17px; height: 17px; }
h2 { font-size: clamp(16px,1.3vw,27px); font-weight: 650; margin: 0; letter-spacing: -.025em; }
.period { font-size: clamp(10px,.69vw,15px); color: #59637a; font-weight: 600; background: #f3f5f9; border: 1px solid #e5e8f0; padding: 5px 9px; border-radius: 6px; white-space: nowrap; }
.gauge { flex: 1; min-height: 0; padding: 0 10px; display: flex; align-items: center; justify-content: center; }
.gauge svg { display: block; height: 100%; width: 100%; max-width: 830px; }
.gauge-value { font-size: 38px; font-weight: 650; letter-spacing: -1.5px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.gauge-percentage { font-size: 21px; fill: var(--muted); }
.gauge-scale { font-size: 14px; fill: #6b7286; font-variant-numeric: tabular-nums; }
.gauge-target { font-size: 12px; fill: var(--blue); font-weight: 650; }
.gauge-warning { font-size: 13px; fill: #9c5f12; font-weight: 600; }
.pending-value { font-size: 30px; letter-spacing: -.5px; }
.card-bottom { border-top: 1px solid #e9ecf2; display: grid; grid-template-columns: 1fr 1fr; margin: 0 1.5vw; padding: 1vh 0; gap: 12px; }
.metric span { display: block; font-size: clamp(9px,.65vw,14px); color: var(--muted); letter-spacing: .025em; margin-bottom: 3px; }
.metric strong { font-size: clamp(14px,1.03vw,23px); font-weight: 650; font-variant-numeric: tabular-nums; }
.metric:last-child { text-align: right; }
.metric .target-label { display: flex; align-items: center; gap: 5px; }
.target-label::before { content: ""; width: 3px; height: 10px; background: var(--blue); display: inline-block; }
footer { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 1.3vh 2.4vw; }
.preview-note { display: flex; align-items: center; gap: 10px; max-width: 62%; }
.preview-badge { font-size: 10px; font-weight: 750; letter-spacing: .08em; color: #865a14; background: #fff1d6; border: 1px solid #eed6b1; border-radius: 4px; padding: 5px 7px; }
.preview-note p { color: #626b7d; font-size: clamp(10px,.68vw,14px); margin: 0; line-height: 1.45; }
.controls { display: flex; align-items: center; gap: 8px; }
.controls label { color: #667084; font-size: 11px; }
.controls select, .controls button { font-size: 11px; padding: 8px; border: 1px solid #cdd4e0; border-radius: 6px; background: white; color: #334059; }
.controls button span { font-size: 14px; margin-left: 5px; }
@media (min-width: 2000px) { .gauge svg { max-width: none; } }
@media (max-width: 1050px) {
 footer { flex-wrap: wrap; gap: 8px; }
 .preview-note { max-width: none; }
 .controls { margin-left: auto; }
 .context { gap: 20px; }
 .snapshot { padding-left: 20px; }
}
@media (max-width: 700px) {
 .dashboard { min-height: 100dvh; height: auto; }
 .topbar { padding: 20px 18px; gap: 14px; }
 .eyebrow { font-size: 8px; letter-spacing: .14em; }
 h1 { font-size: 24px; max-width: 240px; }
 .brand { padding-left: 12px; }
 .brand img { width: 82px; }
 .context { padding: 16px; flex-wrap: wrap; gap: 16px; }
 .context-label { font-size: 8px; }
 .context strong { font-size: 12px; }
 .snapshot { padding-left: 14px; }
 .status { margin-left: 0; padding: 5px 9px; font-size: 10px; }
 main { grid-template-columns: 1fr; grid-template-rows: none; gap: 14px; padding: 0 14px; }
 .card { min-height: 295px; }
 .card-header { padding: 15px 16px 0; }
 .gauge { height: 205px; flex: none; }
 .gauge-value { font-size: 36px; }
 .card-bottom { margin: 0 16px; padding: 12px 0; }
 .metric span { font-size: 10px; }
 .metric strong { font-size: 16px; }
 footer { padding: 16px; }
 .preview-note { align-items: flex-start; }
 .preview-note p { font-size: 11px; }
 .controls { flex-wrap: wrap; margin-left: 0; }
 .controls select { max-width: 195px; }
}
@media (max-width: 360px) { .brand { display: none; } }


.status { background:#eef8f0; border-color:#b9ddc2; color:#26743c; }
.status::before { content:""; width:7px; height:7px; border-radius:50%; background:#2e9e4f; }
.status-error { background:#fff4e8; border-color:#efcf9d; color:#815318; }
.status-error::before { background:#c88221; }
.cutoff { border-left:1px solid #d4d9e3; padding-left:3.4vw; }
footer p { color:#626b7d; font-size:clamp(10px,.68vw,14px); margin:0; line-height:1.45; }
@media (max-width:700px) { .cutoff { padding-left:14px; } }
</style>
</head>
<body>
<div class="dashboard">
<header class="topbar">
  <div class="heading"><p class="eyebrow">ACOMPANHAMENTO COMERCIAL</p><h1>Pedidos e faturamento<span class="title-dot">.</span></h1></div>
  <div class="brand"><img id="brand-logo" alt="SEIBT"></div>
</header>
<section class="context" aria-label="Referência dos dados">
  <div><span class="context-label">PERÍODO</span><strong id="period">Carregando…</strong></div>
  <div class="cutoff"><span class="context-label">FECHAMENTO ATÉ</span><strong id="cutoff">—</strong></div>
  <div class="snapshot"><span class="context-label">PUBLICADO EM</span><strong id="timestamp">—</strong></div>
  <div class="status" id="status" role="status">Carregando dados</div>
</section>
<main id="gauges" aria-label="Indicadores comerciais"></main>
<footer><p id="notice">Carregando fechamento publicado…</p><div class="controls"><button id="fullscreen" type="button">Tela cheia ⛶</button></div></footer>
</div>

const CONFIG = Object.freeze([
 { key: "pedidos_mes", title: "Pedidos", period: "Mês atual", goal: 3580000, max: 6000000, pe: 2650000, type: "order" },
 { key: "faturamento_mes", title: "Faturamento", period: "Mês atual", goal: 3580000, max: 6000000, pe: 2650000, type: "invoice" },
 { key: "pedidos_trimestre", title: "Pedidos", period: "Trimestre atual", goal: 10740000, max: 18000000, pe: 7950000, type: "order" },
 { key: "faturamento_trimestre", title: "Faturamento", period: "Trimestre atual", goal: 10740000, max: 18000000, pe: 7950000, type: "invoice" }
]);
const money = n => new Intl.NumberFormat("pt-BR", {style: "currency", currency: "BRL"}).format(n);
const percent = n => new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 1}).format(n) + "%";
const hasValue = v => typeof v === "number" && Number.isFinite(v) && v >= 0;
const fraction = (v, max) => hasValue(v) ? Math.max(0, Math.min(1, v / max)) : 0;
const point = (radius, ratio) => {
 const angle = Math.PI * (1 - ratio);
 return [310 + radius * Math.cos(angle), 218 - radius * Math.sin(angle)];
};
function icon(type) {
 const path = type === "order" ? '<path d="M8 3h8v4H8zM6 5H4v16h16V5h-2M8 11h8M8 15h6"/>' : '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/>';
 return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
}
function gauge(cfg, value) {
 const valid = hasValue(value), over = valid && value > cfg.max;
 const color = !valid ? "var(--track)" : value < cfg.pe ? "var(--red)" : value < cfg.goal ? "var(--green)" : "var(--blue)";
 const start = point(164, cfg.goal / cfg.max), end = point(204, cfg.goal / cfg.max);
 const valueText = valid ? money(value) : "Aguardando dados";
 const subtitle = valid ? percent(value / cfg.goal * 100) + " da meta" : "Sem valor publicado";
 const warning = over ? "Valor acima da escala · total preservado" : "";
 const scale = new Intl.NumberFormat("pt-BR", {maximumFractionDigits: 0}).format(cfg.max / 1000000);
 return `<svg viewBox="0 0 620 257" role="img" aria-label="${cfg.title}, ${cfg.period}: ${valueText}. ${valid ? subtitle : "Pendente"}. Meta: ${money(cfg.goal)}.">
 <path d="M 125 218 A 185 185 0 0 1 495 218" fill="none" stroke="var(--track)" stroke-width="30"/>
 <path d="M 125 218 A 185 185 0 0 1 495 218" fill="none" stroke="${color}" stroke-width="30" pathLength="100" stroke-dasharray="${fraction(value,cfg.max)*100} 100"/>
 <line x1="${start[0]}" y1="${start[1]}" x2="${end[0]}" y2="${end[1]}" stroke="var(--blue)" stroke-width="3"/>
 <text x="${end[0]+9}" y="${end[1]-6}" class="gauge-target">META</text>
 <text x="310" y="146" text-anchor="middle" class="gauge-percentage">${subtitle}</text>
 <text x="310" y="191" text-anchor="middle" class="gauge-value ${valid ? "" : "pending-value"}">${valueText}</text>
 <text x="310" y="216" text-anchor="middle" class="gauge-warning">${warning}</text>
 <text x="110" y="245" class="gauge-scale">R$ 0</text>
 <text x="510" y="245" text-anchor="end" class="gauge-scale">R$ ${scale} milhões</text>
 </svg>`;
}
function card(cfg,value) {
 const valid=hasValue(value), reached=valid && value>=cfg.goal;
 return `<section class="card" aria-labelledby="title-${cfg.key}">
 <div class="card-header"><div class="card-title"><span class="card-icon">${icon(cfg.type)}</span><h2 id="title-${cfg.key}">${cfg.title}</h2></div><span class="period">${cfg.period}</span></div>
 <div class="gauge">${gauge(cfg,value)}</div>
 <div class="card-bottom"><div class="metric"><span class="target-label">Meta do ${cfg.period === "Mês atual" ? "mês" : "trimestre"}</span><strong>${money(cfg.goal)}</strong></div>
 <div class="metric"><span>${!valid ? "Situação" : reached ? "Acima da meta" : "Falta para a meta"}</span><strong>${valid ? money(Math.abs(cfg.goal-value)) : "Pendente"}</strong></div></div></section>`;
}


const SOURCE = "dados.json";
const REFRESH_MS = 60000;
let lastGood = null;

function brDate(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso))
    throw new Error("Data de corte ausente ou inválida");
  const [year, month, day] = iso.split("-").map(Number);
  const date = new Date(Date.UTC(year, month - 1, day));
  if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day)
    throw new Error("Data de corte inválida");
  return `${String(day).padStart(2,"0")}/${String(month).padStart(2,"0")}/${year}`;
}
function validate(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("Dados inválidos");
  brDate(data.data_corte);
  if (data.fuso_horario !== "America/Sao_Paulo") throw new Error("Fuso horário inválido");
  const published = new Date(data.atualizado_em);
  if (!Number.isFinite(published.getTime())) throw new Error("Horário de publicação inválido");
  for (const cfg of CONFIG) {
    if (!hasValue(data[cfg.key])) throw new Error(`Valor inválido: ${cfg.key}`);
  }
  return published;
}
function setState(label, error = false) {
  const el = document.getElementById("status");
  el.textContent = label;
  el.classList.toggle("status-error", error);
}
function draw(data, published) {
  const cut = brDate(data.data_corte);
  const date = new Date(`${data.data_corte}T12:00:00-03:00`);
  const monthYear = new Intl.DateTimeFormat("pt-BR", {timeZone:"America/Sao_Paulo", month:"long", year:"numeric"}).format(date);
  const time = new Intl.DateTimeFormat("pt-BR", {timeZone:"America/Sao_Paulo", dateStyle:"short", timeStyle:"short"}).format(published);
  document.getElementById("period").textContent = monthYear;
  document.getElementById("cutoff").textContent = cut;
  document.getElementById("timestamp").textContent = `${time} · Nova Petropolis-RS`;
  document.getElementById("gauges").innerHTML = CONFIG.map(cfg => card(cfg, data[cfg.key])).join("");
  document.getElementById("notice").textContent = `Fechamento manual conferido até ${cut}. Os valores mudam somente após uma nova publicação.`;
  setState("Dados publicados");
  lastGood = data;
}
async function refresh() {
  try {
    const response = await fetch(`${SOURCE}?t=${Date.now()}`, {cache:"no-store"});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const published = validate(data);
    draw(data, published);
  } catch (error) {
    setState(lastGood ? "Sem conexão · última posição exibida" : "Dados indisponíveis", true);
    document.getElementById("notice").textContent = lastGood
      ? `A conexão falhou. Mantida a última posição recebida, com corte em ${brDate(lastGood.data_corte)}.`
      : "Não foi possível carregar os dados publicados. Verifique a conexão.";
  }
}

document.getElementById("gauges").innerHTML = CONFIG.map(cfg => card(cfg, null)).join("");
refresh();
setInterval(refresh, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
document.getElementById("fullscreen").addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch { document.getElementById("fullscreen").textContent = "Use F11 para tela cheia"; }
});

// O painel anterior guardava a página em cache. Remove apenas a cópia SEIBT
// para que o endereço normal volte a abrir esta versão atual.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistration("./").then(reg => {
    if (reg && new URL(reg.scope).pathname.includes("VELOCIMETRO_SEIBT_-")) reg.unregister();
  }).catch(() => {});
}
if ("caches" in window) {
  caches.keys().then(keys => Promise.all(keys.filter(k => /^seibt-(app|dados)-/.test(k)).map(k => caches.delete(k)))).catch(() => {});
}

</script>
</body>
</html>
